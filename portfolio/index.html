<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Camarasa — Portfolio</title>
<meta name="description" content="Portfolio of Xavier Camarasa, software developer: a B2B marketplace, client websites, internal tools, mobile apps and academic projects.">
<meta property="og:title" content="Xavier Camarasa — Portfolio">
<meta property="og:description" content="Software developer building tools that real businesses use every day.">
<meta property="og:image" content="slides/s01.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%232B4EEA'/><text x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='white' text-anchor='middle'>XC</text></svg>">
<style>
  :root { --blue: #2B4EEA; --ink: #111318; --muted: #5C6270; --line: #D9DCE2; --bg: #F1F2F5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 "Segoe UI", Calibri, Arial, sans-serif; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  header { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 5; background: rgba(241,242,245,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-family: Arial, sans-serif; letter-spacing: -.01em; }
  .brand b { width: 30px; height: 30px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .brand span { color: var(--muted); font-weight: 400; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tbtn { height: 36px; padding: 0 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: border-color .2s, background .2s; }
  .tbtn:hover { border-color: var(--blue); }
  .tbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tbtn svg { width: 16px; height: 16px; }

  main { position: fixed; inset: 56px 0 64px 0; display: grid; place-items: center; padding: 18px; }
  .stage { position: relative; width: min(100%, calc((100vh - 56px - 64px - 36px) * 16 / 9)); aspect-ratio: 16 / 9; background: #fff; box-shadow: 0 30px 70px -30px rgba(17,19,24,.45); overflow: hidden; }
  .slide { position: absolute; inset: 0; opacity: 0; transform: translateX(3%); transition: opacity .45s ease, transform .45s ease; pointer-events: none; }
  .slide.on { opacity: 1; transform: none; pointer-events: auto; }
  .slide.left { transform: translateX(-3%); }
  .slide img { width: 100%; height: 100%; display: block; }
  .hot { position: absolute; display: block; }
  .hot:hover { background: rgba(43,78,234,.06); outline: 2px solid rgba(43,78,234,.35); }
  .nav-zone { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 2; border: 0; background: transparent; }
  .nav-zone.prev { left: 0; cursor: w-resize; } .nav-zone.next { right: 0; cursor: e-resize; }

  footer { position: fixed; inset: auto 0 0 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: rgba(241,242,245,.92); border-top: 1px solid var(--line); z-index: 5; }
  .arrow { width: 40px; height: 40px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
  .arrow:hover { border-color: var(--blue); }
  .arrow:disabled { opacity: .35; cursor: default; }
  .arrow svg { width: 18px; height: 18px; }
  .meta { flex: 1; min-width: 0; }
  .meta .ttl { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .chap { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--blue); font-weight: 700; }
  .bar { position: absolute; left: 0; top: -1px; height: 3px; background: var(--blue); transition: width .4s ease; }
  .count { font-family: Arial, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-weight: 400; }

  .grid { position: fixed; inset: 56px 0 0 0; background: var(--bg); z-index: 4; overflow: auto; padding: 28px 20px 40px; display: none; }
  .grid.open { display: block; }
  .grid h2 { font-family: Arial, sans-serif; margin: 0 auto 18px; max-width: 1200px; font-size: 22px; }
  .thumbs { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .thumb { border: 1px solid var(--line); background: #fff; padding: 0; text-align: left; transition: transform .2s, border-color .2s; }
  .thumb:hover { transform: translateY(-3px); border-color: var(--blue); }
  .thumb.cur { border: 2px solid var(--blue); }
  .thumb img { width: 100%; aspect-ratio: 16/9; display: block; }
  .thumb div { padding: 8px 10px; font-size: 13px; font-weight: 600; }
  .thumb small { color: var(--muted); font-weight: 400; margin-right: 6px; }

  .hint { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; font-size: 13px; z-index: 6; transition: opacity .6s; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 700px) {
    .brand span, .tbtn .lbl { display: none; }
    main { padding: 10px; }
    .stage { width: min(100%, calc((100vh - 56px - 64px - 20px) * 16 / 9)); }
    .nav-zone { width: 30%; }
  }
  @media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
  @media print {
    html, body { overflow: visible; height: auto; background: #fff; }
    header, footer, .grid, .hint, .nav-zone { display: none !important; }
    main { position: static; display: block; padding: 0; }
    .stage { width: 100%; box-shadow: none; aspect-ratio: auto; overflow: visible; }
    .slide { position: static; opacity: 1; transform: none; page-break-after: always; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>XC</b>Xavier Camarasa <span>— Portfolio 2026</span></div>
  <div class="tools">
    <button class="tbtn" id="gridBtn" aria-label="Show all slides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="lbl">All slides</span></button>
    <button class="tbtn" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M21 8V3h-5M16 21h5v-5M3 16v5h5"/></svg><span class="lbl">Present</span></button>
    <a class="tbtn primary" href="Xavier-Camarasa-Portfolio.pdf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span class="lbl">Download PDF</span></a>
  </div>
</header>

<main>
  <div class="stage" id="stage" aria-roledescription="carousel" aria-label="Portfolio slides">
    <button class="nav-zone prev" id="zPrev" aria-label="Previous slide"></button>
    <button class="nav-zone next" id="zNext" aria-label="Next slide"></button>
  </div>
</main>

<footer>
  <div class="bar" id="bar"></div>
  <button class="arrow" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="arrow" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="meta"><div class="chap" id="chap"></div><div class="ttl" id="ttl" aria-live="polite"></div></div>
  <div class="count" id="count"></div>
</footer>

<section class="grid" id="grid" aria-label="All slides"><h2>All slides</h2><div class="thumbs" id="thumbs"></div></section>
<div class="hint" id="hint">Use ← → or swipe to move between slides</div>

<script>
const SLIDES = [
  ["Introduction", "Xavier Camarasa — Software developer", "Cover: Xavier Camarasa, software developer building tools that real businesses use every day. Studying Software Design with AI & Cloud Computing at TUS, Ireland. Looking for internships and graduate roles. Nine projects in six industries."],
  ["Introduction", "Profile — A developer who listens first", "Profile: studies at TUS; built software for real clients in Spain (a real-estate agency, a sauce factory, a physiotherapist, a local bar) plus an own B2B product. Languages: Spanish and English. Available for internships, graduate roles and freelance."],
  ["01 Featured product", "Chapter 01 — Featured product", "Chapter divider: Maquinaria, the product, and its engineering decisions."],
  ["01 Featured product", "Maquinaria — B2B marketplace", "Maquinaria: construction companies rent idle machinery to each other, with documents verified before hiring. Problem, solution and result. TypeScript, Next.js, REST API, PostgreSQL, OpenStreetMap, testing."],
  ["01 Featured product", "Maquinaria — Under the hood", "By the numbers: 1,406 passing automated tests, 120 API endpoints, 40 database migrations. Decisions: the database refuses double bookings; reviews are written blind; no shared deal, no conversation."],
  ["02 Client work", "Chapter 02 — Client work", "Chapter divider: Mediterranean Blue (real estate), DK Tegoria Salsas (food manufacturing), Bar Castelló (hospitality), physiotherapist (health)."],
  ["02 Client work", "Mediterranean Blue Realty", "Bilingual luxury real-estate website with listings, galleries, news, blog and an admin panel. Outcome: the agency runs its own content day to day."],
  ["02 Client work", "DK Tegoria Salsas", "Internal platform replacing paper: clock-in/out, 16 quality-control report types, one-click Excel export. Outcome: less paper, fewer errors, data ready for any inspection."],
  ["02 Client work", "Bar Castelló", "From prototype to a live digital menu the owner updates from an admin panel. Outcome: new dishes and prices go live in seconds."],
  ["02 Client work", "Physiotherapist website", "Personal-brand landing page for a registered physiotherapist, mobile-first with a GDPR cookie banner. Outcome: a credible first impression, legally sound from day one."],
  ["03 Mobile & academic", "Chapter 03 — Mobile & academic", "Chapter divider: SolidarityHub, live-music review app, Cost of Living Visualizer, final-year project."],
  ["03 Mobile & academic", "Mobile apps — SolidarityHub & live-music app", "SolidarityHub: Android app inspired by the DANA floods connecting volunteers with affected people. Live-music review app: ratings, photos, collections and friends."],
  ["03 Mobile & academic", "Academic work", "Cost of Living Visualizer: team data-visualisation dashboard (Python, pandas, Streamlit, Plotly). Final-year project: AI-assisted manufacturing drawing generation for Autodesk Inventor."],
  ["04 How I work & skills", "How I work — Listen first, then build", "Process: listen, prototype, build & test, hand over — each step backed by a real project."],
  ["04 How I work & skills", "Skills — What I bring to a team", "Front end, back end & data, mobile, data & AI, engineering practice and professional skills."],
  ["Thank you", "Let's build something useful", "Closing: open to internships, graduate roles and freelance projects. Contact details on my CV."],
];
const HOTSPOTS = {};

const $ = s => document.querySelector(s);
const stage = $("#stage"), N = SLIDES.length;
const pad = n => String(n).padStart(2, "0");
const els = SLIDES.map(([chap, title, alt], i) => {
  const d = document.createElement("div");
  d.className = "slide"; d.setAttribute("role", "group"); d.setAttribute("aria-roledescription", "slide"); d.setAttribute("aria-label", `${i + 1} of ${N}: ${title}`);
  d.innerHTML = `<img src="slides/s${pad(i + 1)}.jpg" alt="${alt.replace(/"/g, "&quot;")}" ${i > 2 ? 'loading="lazy"' : ""}>`;
  (HOTSPOTS[i + 1] || []).forEach(h => {
    const a = document.createElement("a");
    a.className = "hot"; a.href = "#" + h.to; a.style.cssText = `left:5.6%;width:88.8%;top:${h.top}%;height:${h.h}%`;
    a.setAttribute("aria-label", "Go to " + SLIDES[h.to - 1][1]);
    d.appendChild(a);
  });
  stage.appendChild(d); return d;
});
let cur = 0;
function go(n, push = true) {
  n = Math.max(0, Math.min(N - 1, n));
  els.forEach((e, i) => { e.classList.toggle("on", i === n); e.classList.toggle("left", i < n); });
  cur = n;
  $("#ttl").textContent = SLIDES[n][1];
  $("#chap").textContent = SLIDES[n][0];
  $("#count").innerHTML = `${pad(n + 1)} <span>/ ${pad(N)}</span>`;
  $("#bar").style.width = ((n + 1) / N * 100) + "%";
  $("#prev").disabled = n === 0; $("#next").disabled = n === N - 1;
  document.querySelectorAll(".thumb").forEach((t, i) => t.classList.toggle("cur", i === n));
  if (push) history.replaceState(null, "", "#" + (n + 1));
  [n + 1, n + 2].forEach(k => { if (els[k]) els[k].querySelector("img").loading = "eager"; });
}
$("#prev").onclick = $("#zPrev").onclick = () => go(cur - 1);
$("#next").onclick = $("#zNext").onclick = () => go(cur + 1);
addEventListener("keydown", e => {
  if ($("#grid").classList.contains("open")) { if (e.key === "Escape" || e.key.toLowerCase() === "g") toggleGrid(false); return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(N - 1);
  else if (e.key.toLowerCase() === "g") toggleGrid(true);
  else if (e.key.toLowerCase() === "f") fullscreen();
});
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n) go(n - 1, false); });
// swipe
let x0 = null;
stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); x0 = null; });
// grid
const thumbs = $("#thumbs");
SLIDES.forEach(([, title], i) => {
  const b = document.createElement("button"); b.className = "thumb";
  b.innerHTML = `<img src="slides/t${pad(i + 1)}.jpg" alt=""><div><small>${pad(i + 1)}</small>${title}</div>`;
  b.onclick = () => { go(i); toggleGrid(false); };
  thumbs.appendChild(b);
});
function toggleGrid(open) { $("#grid").classList.toggle("open", open); if (open) document.querySelector(".thumb.cur")?.scrollIntoView({ block: "center" }); }
$("#gridBtn").onclick = () => toggleGrid(!$("#grid").classList.contains("open"));
function fullscreen() { const el = document.documentElement; if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); else document.exitFullscreen(); }
$("#fsBtn").onclick = fullscreen;
setTimeout(() => { $("#hint").style.opacity = 0; }, 3500);
go((parseInt(location.hash.slice(1), 10) || 1) - 1, false);
</script>
</body>
</html>
