  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .meta { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 24px; color: var(--muted); font-size: 14px; animation: up .7s .3s ease both; }
  .meta b { display: block; color: #fff; font-size: 15px; margin-top: 4px; }
  .chapters { margin-top: 30px; border-top: 1px solid #1f2430; animation: up .7s .4s ease both; }
